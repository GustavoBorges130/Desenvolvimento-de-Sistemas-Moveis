name: fast_location
description: "FastLocation - consulta de CEP e endereços para os entregadores da FastDelivery."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Comunicação HTTP com a API pública ViaCEP
  dio: ^4.0.6

  # Gerenciamento de estado reativo
  flutter_mobx: ^2.0.4
  mobx: ^2.0.6+1

  # Armazenamento local (histórico de consultas)
  hive: ^2.1.0
  hive_flutter: ^1.1.0
  path: ^1.8.0
  path_provider: ^2.0.2
  path_provider_android: ^2.0.14
  path_provider_ios: ^2.0.9

  # Rota até o endereço consultado
  map_launcher: ^2.2.1+1
  geocoding: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de código (stores do MobX e adapters do Hive)
  mobx_codegen: ^2.0.1+3
  build_runner: ^2.0.5
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

# O map_launcher 2.x (versão pedida no desafio) ainda usa a API de plugins
# "v1 embedding" do Android (PluginRegistry.Registrar), removida do Flutter
# na versão 3.29; com ela o app não compila para Android. A 4.6.0 é a versão
# mais recente com a mesma API usada no projeto (MapLauncher.installedMaps,
# AvailableMap.showDirections e Coords) e já compatível com o Gradle atual.
dependency_overrides:
  map_launcher: ^4.6.0
